repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8

  # Local hook to run tests with coverage before pushing
  - repo: local
    hooks:
      - id: pytest-cov
        name: Run pytest with coverage ≥60%
        entry: pytest  --cov=catalog/models  --cov=user/models --cov-report=term-missing --cov-fail-under=60
        language: system
        pass_filenames: false
        stages: [pre-push]
