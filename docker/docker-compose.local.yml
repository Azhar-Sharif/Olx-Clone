version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - ../.env.local
    volumes:
      - ..:/app
    depends_on:
      - db

  db:
    image: postgres:17
    env_file:
      - ../.env.local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/

volumes:
  pgdata:
