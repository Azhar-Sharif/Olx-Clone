version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - ../.env.production
    depends_on:
      - db
    restart: always

  db:
    image: postgres:17
    env_file:
      - ../.env.production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/
    restart: always

volumes:
  pgdata:
