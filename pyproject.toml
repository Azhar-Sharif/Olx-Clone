[tool.black]
line-length = 79
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | venv
  | env
  | __pycache__
  | migrations
  | manage\.py
  | staticfiles
  | static
  | media
  | mediafiles
  | logs
  | build
  | dist
  | .*\.egg-info
)/
'''

[tool.isort]
profile = "black"
line_length = 79
skip_glob = [
    "venv/**",
    "env/**",
    ".venv/**",
    "*/migrations/*",
    "*/staticfiles/*",
    "*/static/*",
    "*/media/*",
    "*/mediafiles/*",
    "*/logs/*",
    "*/__pycache__/*",
    "build/*",
    "dist/*",
    "*.egg-info/*"
]
skip = ["manage.py"]
